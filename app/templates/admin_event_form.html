{% extends "base.html" %}
{% block title %}{{ 'Edit' if event else 'Add' }} Event{% endblock %}
{% block content %}
<div class="form-card">
  <h2>{{ 'Edit' if event else 'Add' }} Event</h2>
  <form method="POST">
    <label>Name</label>
    <input type="text" name="name" value="{{ event.name if event else '' }}" required>
    <label>Date</label>
    <input type="text" name="date" placeholder="e.g. 2026-09-20" value="{{ event.date if event else '' }}" required>
    <label>Venue</label>
    <input type="text" name="venue" value="{{ event.venue if event else '' }}" required>
    <label>Price (₹)</label>
    <input type="number" step="0.01" name="price" value="{{ event.price if event else '' }}" required>
    <label>Total Seats</label>
    <input type="number" name="total_seats" value="{{ event.total_seats if event else '' }}" {{ 'readonly' if event else '' }} required>
    {% if event %}<p class="hint">Seat count can't be changed after creation (existing bookings depend on it).</p>{% endif %}
    <button type="submit" class="btn">Save</button>
  </form>
</div>
{% endblock %}
