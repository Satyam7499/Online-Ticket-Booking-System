{% extends "base.html" %}
{% block title %}My Bookings{% endblock %}
{% block content %}
<h2>My Bookings</h2>
<table class="table">
  <tr><th>Booking ID</th><th>Event</th><th>Seat</th><th>Status</th><th>Ticket</th></tr>
  {% for b in bookings %}
  <tr>
    <td>#{{ b.id }}</td>
    <td>{{ b.event.name }}</td>
    <td>{{ b.seat.seat_no }}</td>
    <td>{{ b.payment_status }}</td>
    <td><a href="{{ url_for('booking.ticket', booking_id=b.id) }}">View</a></td>
  </tr>
  {% else %}
  <tr><td colspan="5">No bookings yet.</td></tr>
  {% endfor %}
</table>
{% endblock %}
